<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Dynamic background animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    
    @keyframes float-slow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes float-reverse {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .bg-node { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float-slow 7s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: float-reverse 8s ease-in-out infinite; transform-origin: center; }
    .connecting-line { stroke-dasharray: 8, 8; animation: dash 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="320" fill="url(#glow)" rx="16"/>

  <!-- Dynamic / Animated Background Elements (Positioned away from text or low opacity) -->
  <g opacity="0.25">
    <!-- Grid Overlay -->
    <path d="M0,64 H1200 M0,128 H1200 M0,192 H1200 M0,256 H1200" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <path d="M150,0 V320 M300,0 V320 M450,0 V320 M600,0 V320 M750,0 V320 M900,0 V320 M1050,0 V320" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Animated Floating Cluster Nodes in Background/Sides -->
  <g class="floating-card-1" opacity="0.4">
    <circle cx="1020" cy="80" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="1020,50 1045,65 1045,95 1020,110 995,95 995,65" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1020" y="84" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">K8S</text>
  </g>

  <g class="floating-card-2" opacity="0.35">
    <circle cx="120" cy="240" r="55" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect x="90" y="220" width="60" height="40" rx="6" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <text x="120" y="244" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold">CAPI</text>
  </g>

  <g class="bg-node">
    <circle cx="1100" cy="230" r="70" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="6,6"/>
    <circle cx="1100" cy="230" r="35" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Dynamic Connecting Network Lines -->
  <path class="connecting-line" d="M 160 210 Q 300 120 1020 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <path class="connecting-line" d="M 1020 80 Q 950 250 1100 230" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>

  <!-- Foreground Content (Clear & Distinct) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="15" cy="15" r="5" fill="#38bdf8"/>
      <text x="30" y="20" class="badge-text">KUBERNETES ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Cluster Lifecycle Management 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated Platforms, Tools &amp; Frameworks for Multi-Cluster Fleet Operations</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 220)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="20" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">⚡ Provisioning</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="212" y="20" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🔄 Fleet Upgrades</text>

      <!-- Tag 3 -->
      <rect x="294" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="369" y="20" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🛡️ Day-2 Operations</text>

      <!-- Tag 4 -->
      <rect x="456" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="526" y="20" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🌐 Hybrid &amp; Edge</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
</svg>
